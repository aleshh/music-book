<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Three widths of listening attention</title>
  <desc id="desc">A broad sounding field contains several events. Focal listening circles one event, peripheral listening distinguishes a foreground from a continuing condition, and distributed listening connects several events without fixing one permanent center.</desc>
  <rect width="640" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#1b1b1b" stroke-width="2">
    <rect x="20" y="42" width="185" height="190" rx="4"/>
    <rect x="227" y="42" width="185" height="190" rx="4"/>
    <rect x="434" y="42" width="185" height="190" rx="4"/>
  </g>
  <g fill="#1b1b1b">
    <circle cx="63" cy="96" r="7"/><circle cx="145" cy="89" r="5"/>
    <circle cx="89" cy="174" r="5"/><circle cx="166" cy="186" r="6"/>
    <circle cx="270" cy="96" r="7"/><circle cx="352" cy="89" r="5"/>
    <circle cx="296" cy="174" r="5"/><circle cx="373" cy="186" r="6"/>
    <circle cx="477" cy="96" r="7"/><circle cx="559" cy="89" r="5"/>
    <circle cx="503" cy="174" r="5"/><circle cx="580" cy="186" r="6"/>
  </g>
  <g fill="none" stroke="#1b1b1b">
    <circle cx="63" cy="96" r="25" stroke-width="3"/>
    <path d="M247 121 C278 134 314 134 392 116" stroke-width="2.5"/>
    <path d="M459 119 C492 133 536 130 578 108 M485 157 C519 139 553 146 584 176" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" text-anchor="middle">
    <text x="112" y="266" font-size="18" font-weight="700">Focal</text>
    <text x="319" y="266" font-size="18" font-weight="700">Peripheral</text>
    <text x="526" y="266" font-size="18" font-weight="700">Distributed</text>
    <text x="112" y="288" font-size="13">one relation closely</text>
    <text x="319" y="288" font-size="13">event against condition</text>
    <text x="526" y="288" font-size="13">several changing centers</text>
  </g>
</svg>

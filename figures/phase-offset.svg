<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">A repeated pattern moving through phase offsets</title>
  <desc id="desc">A fixed four-position cycle is shown on one line. A second copy begins aligned, then advances through three offsets, changing which attacks coincide with the fixed pattern.</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <g stroke="#b5b5b5" stroke-width="1" stroke-dasharray="3 5">
    <line x1="150" y1="42" x2="150" y2="292"/><line x1="255" y1="42" x2="255" y2="292"/>
    <line x1="360" y1="42" x2="360" y2="292"/><line x1="465" y1="42" x2="465" y2="292"/>
    <line x1="570" y1="42" x2="570" y2="292"/>
  </g>
  <g stroke="#1b1b1b" stroke-width="2">
    <line x1="150" y1="75" x2="570" y2="75"/><line x1="150" y1="135" x2="570" y2="135"/>
    <line x1="150" y1="195" x2="570" y2="195"/><line x1="150" y1="255" x2="570" y2="255"/>
  </g>
  <g fill="#1b1b1b">
    <circle cx="150" cy="75" r="9"/><circle cx="255" cy="75" r="5"/><circle cx="360" cy="75" r="5"/>
    <circle cx="150" cy="135" r="9"/><circle cx="255" cy="135" r="5"/><circle cx="360" cy="135" r="5"/>
    <circle cx="255" cy="195" r="9"/><circle cx="360" cy="195" r="5"/><circle cx="465" cy="195" r="5"/>
    <circle cx="360" cy="255" r="9"/><circle cx="465" cy="255" r="5"/><circle cx="570" cy="255" r="5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b">
    <text x="22" y="80" font-size="15" font-weight="700">fixed copy</text>
    <text x="22" y="140" font-size="15">moving: unison</text>
    <text x="22" y="200" font-size="15">offset 1</text>
    <text x="22" y="260" font-size="15">offset 2</text>
    <text x="150" y="320" font-size="13" text-anchor="middle">long</text>
    <text x="255" y="320" font-size="13" text-anchor="middle">short</text>
    <text x="360" y="320" font-size="13" text-anchor="middle">short</text>
    <text x="465" y="320" font-size="13" text-anchor="middle">rest</text>
  </g>
</svg>

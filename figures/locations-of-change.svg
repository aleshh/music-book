<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
  <title id="title">Four locations where musical form can change</title>
  <desc id="desc">Four connected boxes identify changes in material, relationships, listener, and context. Arrows in both directions show that a change in one location can alter the meaning of the others.</desc>
  <rect width="640" height="410" fill="#ffffff"/>
  <g fill="#ffffff" stroke="#1b1b1b" stroke-width="2.4">
    <rect x="45" y="45" width="235" height="125" rx="5"/>
    <rect x="360" y="45" width="235" height="125" rx="5"/>
    <rect x="45" y="240" width="235" height="125" rx="5"/>
    <rect x="360" y="240" width="235" height="125" rx="5"/>
  </g>
  <g fill="none" stroke="#777" stroke-width="2" marker-end="url(#arrow)">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/></marker></defs>
    <path d="M280 108 L360 108"/>
    <path d="M162 170 L162 240"/>
    <path d="M478 170 L478 240"/>
    <path d="M280 302 L360 302"/>
    <path d="M270 160 L370 250"/>
    <path d="M370 160 L270 250"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b1b1b" text-anchor="middle">
    <text x="162" y="88" font-size="21" font-weight="700">Material</text>
    <text x="162" y="119" font-size="15">pitch, rhythm, articulation</text>
    <text x="162" y="143" font-size="15">dynamics, timbre</text>
    <text x="478" y="88" font-size="21" font-weight="700">Relationships</text>
    <text x="478" y="119" font-size="15">voicing, density, register</text>
    <text x="478" y="143" font-size="15">figure and ground</text>
    <text x="162" y="283" font-size="21" font-weight="700">Listener</text>
    <text x="162" y="314" font-size="15">attention, memory</text>
    <text x="162" y="338" font-size="15">expectation, fatigue</text>
    <text x="478" y="283" font-size="21" font-weight="700">Context</text>
    <text x="478" y="314" font-size="15">performers, room, activity</text>
    <text x="478" y="338" font-size="15">place, duration</text>
  </g>
</svg>
